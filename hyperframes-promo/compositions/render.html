  <script>
    const tl = gsap.timeline({ paused: true });
    const TRACK = 712;
    const CELLS = 25;

    // Initial state matches the editor's last frame.
    gsap.set("#rd-fill", { scaleX: 0.1 });
    gsap.set("#rd-knob", { x: TRACK * 0.1 });
    gsap.set(["#rd-hb1", "#rd-hb2"], { opacity: 0 });
    gsap.set(["#rd-l2", "#rd-l3", "#rd-l4", "#rd-l5", "#rd-l6"], { opacity: 0 });

    // Headline swap.
    tl.to(["#rd-hw1", "#rd-hw2", "#rd-hw3"], {
      opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in", stagger: 0.04,
    }, 0.2);
    tl.fromTo(["#rd-hb1", "#rd-hb2"], { opacity: 0, filter: "blur(6px)" }, {
      opacity: 1, filter: "blur(0px)", duration: 0.13, ease: "power4.out", stagger: 0.07,
    }, 0.5);

    // The editor pane becomes the terminal, rising from its bottom edge.
    tl.fromTo("#rd-term", { clipPath: "inset(100% 0% 0% 0% round 18px)" }, {
      clipPath: "inset(0% 0% 0% 0% round 18px)", duration: 0.6, ease: "power3.inOut",
    }, 0.3);

    // Type the command.
    tl.fromTo("#rd-cmd", { clipPath: "inset(0 100% 0 0)" }, {
      clipPath: "inset(0 0% 0 0)", duration: 1.05, ease: "steps(35)",
    }, 1.0);
    tl.to("#rd-l2", { opacity: 1, duration: 0.02 }, 2.25);
    tl.to("#rd-l3", { opacity: 1, duration: 0.02 }, 2.32);
    tl.to("#rd-l4", { opacity: 1, duration: 0.02 }, 2.5);

    // Progress, in the real CLI's own stages. A pure function of tween progress.
    const bar = document.getElementById("rd-bar");
    const pct = document.getElementById("rd-pct");
    const stage = document.getElementById("rd-stage");
    const prog = { p: 0 };
    function paint() {
      const p = prog.p;
      let percent, label;
      if (p < 0.86) {
        const k = p / 0.86;
        percent = Math.round(26 + 54 * k);
        label = "Streaming frame " + Math.round(1 + 899 * k) + "/900";
      } else if (p < 0.95) {
        percent = 90;
        label = "Assembling final video";
      } else {
        percent = 100;
        label = "Render complete";
      }
      const filled = Math.round((CELLS * percent) / 100);
      bar.textContent = "█".repeat(filled) + "░".repeat(CELLS - filled);
      pct.textContent = (percent < 100 ? " " : "") + percent + "%";
      stage.textContent = label;
    }
    tl.fromTo(prog, { p: 0 }, { p: 1, duration: 2.2, ease: "none", onUpdate: paint }, 2.5);
    tl.to("#rd-fill", { scaleX: 1, duration: 1.9, ease: "none" }, 2.5);
    tl.to("#rd-knob", { x: TRACK, duration: 1.9, ease: "none" }, 2.5);
    tl.to("#rd-l5", { opacity: 1, duration: 0.02 }, 4.8);
    tl.to("#rd-l6", { opacity: 1, duration: 0.02 }, 4.86);

    // Clear the workspace; the finished video shrinks into one film cell at centre.
    tl.to(["#rd-head-b", "#rd-term", "#rd-pane", "#rd-barwrap"], {
      opacity: 0, filter: "blur(10px)", duration: 0.3, ease: "power3.in", stagger: 0.04,
    }, 5.4);
    tl.to("#rd-player", { x: -256, y: 182, scale: 384 / 800, duration: 0.9, ease: "power3.inOut" }, 5.5);
    tl.to("#rd-video", { borderRadius: 0, duration: 0.6, ease: "power2.inOut" }, 5.6);
    tl.set({}, {}, 7);
    window.__timelines["render"] = tl;
  </script>
