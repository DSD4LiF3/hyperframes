  <script>
    const tl = gsap.timeline({ paused: true });
    const IN = { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power4.out" };
    const OUT = { opacity: 0, filter: "blur(8px)", duration: 0.15, ease: "power2.in" };

    // Initial transforms (never in CSS on elements GSAP moves).
    gsap.set("#ct-row", { x: -126 });
    gsap.set("#strip", { x: -1080 });
    gsap.set("#file", { y: 300, scale: 0.3 });

    // 1. Pick a frame: 89 rolls to 90, the tick row steps one cell.
    tl.to("#ct-roll", { y: -340, duration: 0.45, ease: "expo.out" }, 0.3);
    tl.to("#ct-row", { x: -258, duration: 0.45, ease: "expo.out" }, 0.3);

    // 2. Work out the time: 90 / 30 fps = 3.0 s.
    tl.to("#hl1", OUT, 2.2);
    tl.to(["#ct-label", "#ct-win", "#ct-ticks"], { ...OUT, duration: 0.2, stagger: 0.03 }, 2.2);
    tl.to("#hl2", IN, 2.35);
    tl.to("#eq1", IN, 2.45);
    tl.to("#eq2", IN, 2.9);
    tl.to("#eq-t", { ...IN, duration: 0.22 }, 3.1);

    // 3. Seek: the time flies to the timeline, the playhead seeks, the ball jumps.
    tl.to("#hl2", OUT, 4.5);
    tl.to(["#eq1", "#eq2"], OUT, 4.5);
    tl.to("#hl3", IN, 4.65);
    tl.to("#win", { ...IN, duration: 0.3 }, 4.6);
    tl.fromTo("#win", { clipPath: "inset(0% 0% 100% 0% round 18px)" }, {
      clipPath: "inset(0% 0% 0% 0% round 18px)", duration: 0.45, ease: "power3.out", immediateRender: false,
    }, 4.6);
    tl.to(["#tr", "#tr-0", "#tr-5", "#ph"], { ...IN, stagger: 0.04 }, 4.8);
    tl.to("#eq-t", { x: 62, y: 195, scale: 40 / 220, duration: 0.6, ease: "power3.inOut" }, 4.7);
    tl.to("#ph", { x: 372, duration: 0.6, ease: "power3.inOut" }, 5.4);
    tl.to("#win-ball", { x: 297, duration: 0.6, ease: "power3.inOut" }, 5.4);
    tl.to("#sub", IN, 5.55);

    // 4. Capture: a flash, and the frame drops into its slot.
    tl.to(["#hl3", "#sub"], OUT, 6.9);
    tl.to("#hl4", IN, 7.05);
    tl.to("#strip", { x: 0, duration: 0.5, ease: "power3.out" }, 7.0);
    tl.to("#win-flash", { opacity: 0.9, duration: 0.05, ease: "none" }, 7.35);
    tl.to("#win-flash", { opacity: 0, duration: 0.25, ease: "power2.out" }, 7.4);
    tl.to("#still", { opacity: 1, duration: 0.01 }, 7.4);
    tl.to("#still", { y: 373, scale: 180 / 620, duration: 0.6, ease: "expo.out" }, 7.45);
    tl.to("#sc-slot-fill", { opacity: 1, duration: 0.01 }, 8.05);
    tl.to("#still", { opacity: 0, duration: 0.01 }, 8.06);

    // 5. Encode: every slot fills, the strip runs and collapses into the file.
    tl.to("#hl4", OUT, 8.7);
    tl.to("#hl5", IN, 8.85);
    tl.to(["#win", "#tr", "#tr-0", "#tr-5", "#ph", "#eq-t"], { ...OUT, duration: 0.25, ease: "power3.in" }, 8.8);
    tl.to(".sc-later", { opacity: 1, duration: 0.05, stagger: 0.07 }, 8.95);
    tl.to("#strip-row", { x: -400, filter: "blur(6px)", duration: 0.45, ease: "power3.in" }, 9.25);
    tl.to("#strip", { scaleX: 0, transformOrigin: "450px 50%", duration: 0.3, ease: "power3.in" }, 9.6);
    tl.to("#strip", { opacity: 0, duration: 0.05 }, 9.88);
    tl.to("#file", { y: 0, scale: 1, opacity: 1, duration: 0.55, ease: "expo.out" }, 9.75);

    // 6. Same frame, every time: back to the start, matching frame 0.
    tl.to("#hl5", OUT, 10.6);
    tl.to("#hl6", IN, 10.75);
    tl.to("#file", { y: 300, opacity: 0, duration: 0.35, ease: "power3.in" }, 10.8);
    tl.set("#ct-roll", { y: 0 }, 10.9);
    tl.set("#ct-row", { x: -126 }, 10.9);
    tl.to(["#ct-label", "#ct-win", "#ct-ticks"], { ...IN, duration: 0.22, stagger: 0.04 }, 11.0);
    tl.to("#hl6", OUT, 12.35);
    tl.to("#hl1", IN, 12.5);
